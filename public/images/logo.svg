<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#66BB6A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B5E20;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Decorative leaves -->
  <path d="M 50 120 Q 30 100 40 70 Q 50 40 70 50 Q 80 60 70 80 Q 50 100 50 120 Z" fill="url(#leafGrad)" />
  <path d="M 150 120 Q 170 100 160 70 Q 150 40 130 50 Q 120 60 130 80 Q 150 100 150 120 Z" fill="url(#leafGrad)" />
  <!-- Mortar bowl -->
  <path d="M 70 70 Q 100 60 130 70 L 140 110 Q 100 120 60 110 Z" fill="url(#bowlGrad)" stroke="#2E7D32" stroke-width="3" />
  <ellipse cx="100" cy="70" rx="30" ry="10" fill="none" stroke="#2E7D32" stroke-width="3" />
  <!-- Pestle -->
  <path d="M 100 60 L 100 40 Q 100 30 105 30 Q 110 30 110 40 L 110 60 Z" fill="#4CAF50" stroke="#2E7D32" stroke-width="2" />
  <circle cx="105" cy="35" r="8" fill="#2E7D32" />
  <!-- Brand name -->
  <text x="100" y="155" font-family="serif" font-size="28" font-weight="bold" fill="#000000" text-anchor="middle">Herbbo</text>
  <text x="100" y="180" font-family="sans-serif" font-size="10" fill="#2E7D32" text-anchor="middle">Natural Wellness</text>
</svg>
